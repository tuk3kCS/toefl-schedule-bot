name: Theo dõi TOEFL ITP máy tính tại Hà Nội

on:
  schedule:
    # GitHub Actions dùng UTC. Chạy mỗi 15 phút; lịch có thể bị GitHub trì hoãn.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iig-toefl-itp-hanoi-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lấy mã nguồn và state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: python -m pip install --requirement requirements.txt

      - name: Kiểm tra lịch thi và gửi Telegram nếu có lịch mới
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IIG_EXAM_CODE: ${{ vars.IIG_EXAM_CODE }}
          IIG_EXAM_NAME: ${{ vars.IIG_EXAM_NAME }}
          IIG_AREA_CODE: ${{ vars.IIG_AREA_CODE }}
          IIG_AREA_NAME: ${{ vars.IIG_AREA_NAME }}
          IIG_ONLY_OPEN: ${{ vars.IIG_ONLY_OPEN }}
          NOTIFY_ON_FIRST_RUN: ${{ vars.NOTIFY_ON_FIRST_RUN }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py --state .state/iig_toefl_itp_hanoi.json

      - name: Lưu fingerprint tối thiểu vào repository
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- .state/iig_toefl_itp_hanoi.json)" ]]; then
            echo "State không đổi."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/iig_toefl_itp_hanoi.json
          git commit -m "chore: update IIG schedule fingerprints [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
